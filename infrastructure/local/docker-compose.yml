services:
  postgres:
    image: postgres:16-alpine
    container_name: dentpilot-postgres
    environment:
      POSTGRES_DB: dentpilot_smile
      POSTGRES_USER: dentpilot
      POSTGRES_PASSWORD: dentpilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentpilot -d dentpilot_smile"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dentpilot_postgres:/var/lib/postgresql/data
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dentpilot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dentpilot_minio:/data

volumes:
  dentpilot_postgres:
  dentpilot_minio:
